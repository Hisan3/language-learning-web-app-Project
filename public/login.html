<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LearnGlow</title>
  <link rel="stylesheet" href="./styles/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Back Button -->
  <a href="index.html" class="back-button">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>Back</span>
  </a>

  <div class="page-container">
    <div class="content-wrapper">
      <!-- Headline -->
      <h1 class="main-heading">Welcome Back!</h1>

      <!-- Form Card -->
      <div class="card">
        <!-- Illustration - Replaceable Component -->
        <div class="illustration-container">
          <img 
            src="./asset/loginimage.png" 
            alt="Cute Mushroom Illustration - Unsplash" 
            class="illustration"
            data-source="unsplash.com/photos/cute-mushroom"
          />
        </div>

        <!-- Form -->
        <form id="loginForm" class="form">
          <div class="form-group">
            <label for="email" class="label">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="your@email.com"
              class="input"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              class="input"
              required
            />
          </div>

          <button type="submit" class="submit-button" id="submitButton">
            SIGN IN
          </button>
        </form>

        <div class="divider">or</div>

        <button type="button" id="googleSignIn" class="google-button">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.1713 8.36788H17.5V8.33329H10V11.6666H14.7096C14.0225 13.6071 12.1762 15 10 15C7.23917 15 5 12.7608 5 9.99996C5 7.23913 7.23917 4.99996 10 4.99996C11.2746 4.99996 12.4342 5.48079 13.3171 6.26663L15.6742 3.90954C14.1858 2.52204 12.195 1.66663 10 1.66663C5.39792 1.66663 1.66667 5.39788 1.66667 9.99996C1.66667 14.602 5.39792 18.3333 10 18.3333C14.6021 18.3333 18.3333 14.602 18.3333 9.99996C18.3333 9.44121 18.2758 8.89579 18.1713 8.36788Z" fill="#FFC107"/>
            <path d="M2.6275 6.12121L5.36542 8.12913C6.10625 6.29496 7.90042 4.99996 10 4.99996C11.2746 4.99996 12.4342 5.48079 13.3171 6.26663L15.6742 3.90954C14.1858 2.52204 12.195 1.66663 10 1.66663C6.79917 1.66663 4.02334 3.47371 2.6275 6.12121Z" fill="#FF3D00"/>
            <path d="M10 18.3333C12.1525 18.3333 14.1083 17.5095 15.5871 16.17L13.0079 13.9875C12.1431 14.6452 11.0864 15.0009 10 15C7.83255 15 5.99172 13.618 5.29797 11.6891L2.58047 13.783C3.96005 16.4816 6.7613 18.3333 10 18.3333Z" fill="#4CAF50"/>
            <path d="M18.1713 8.36796H17.5V8.33337H10V11.6667H14.7096C14.3809 12.5902 13.7889 13.3972 13.0067 13.9879L13.0079 13.9871L15.5871 16.1696C15.4046 16.3355 18.3333 14.1667 18.3333 10C18.3333 9.44129 18.2758 8.89587 18.1713 8.36796Z" fill="#1976D2"/>
          </svg>
          Continue with Google
        </button>

        <!-- Decorative Clouds -->
        <div class="cloud cloud-left"></div>
        <div class="cloud cloud-right"></div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <script src="./js/login.js"></script>
</body>
</html>
