<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Affirmation - LearnGlow Admin ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: linear-gradient(135deg, #E0C3FC 0%, #8EC5FC 100%); min-height: 100vh; padding: 20px; }
    .form-input, .form-select { width: 100%; padding: 12px; border: 2px solid #E0E7FF; border-radius: 12px; margin-bottom: 15px; font-family: 'Poppins', sans-serif; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #667eea; }
  </style>
</head>
<body>
  <div style="max-width: 900px; margin: 0 auto;">
    <div style="background: white; padding: 30px; border-radius: 20px; margin-bottom: 30px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); display: flex; justify-content: space-between; align-items: center;">
      <h1 style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 28px; font-weight: 700;">💭 Add Daily Affirmation</h1>
      <a href="/admin/affirmations" style="background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); color: #333; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: 500;">← Back</a>
    </div>

    <div style="background: white; border-radius: 20px; padding: 30px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);">
      <form action="/admin/affirmations/add" method="POST">
        <label style="display: block; font-weight: 600; color: #4a5568; margin-bottom: 5px;">Affirmation *</label>
        <input type="text" name="affirmation" class="form-input" placeholder="e.g., I am capable of achieving my goals" required>

        <label style="display: block; font-weight: 600; color: #4a5568; margin-bottom: 5px;">Category *</label>
        <select name="category" class="form-select" required>
          <option value="self-love">Self Love</option>
          <option value="confidence">Confidence</option>
          <option value="success">Success</option>
          <option value="peace">Peace</option>
          <option value="gratitude">Gratitude</option>
          <option value="motivation">Motivation</option>
        </select>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button type="submit" style="flex: 1; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px; border-radius: 12px; border: none; cursor: pointer; font-weight: 500;">Save Affirmation</button>
          <a href="/admin/affirmations" style="flex: 1; background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white; padding: 12px; border-radius: 12px; text-decoration: none; text-align: center; font-weight: 500; display: block;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
